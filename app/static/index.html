<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/hub">
        <img class="logo" src="/favicon.svg" alt="" width="26" height="26">
        <span class="brand-name">Skills&nbsp;Hub</span>
        <span class="proto-badge" title="Dummy data — real wiring comes after your feedback">prototype</span>
      </a>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab" id="tab-hub" role="tab" data-view="hub">Hub <span class="tab-count" id="count-hub"></span></button>
        <button class="tab" id="tab-projects" role="tab" data-view="projects">Projects <span class="tab-count" id="count-projects"></span></button>
      </nav>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <path d="M9 3.5a5.5 5.5 0 1 0 3.4 9.82l3.64 3.63.7-.7-3.63-3.64A5.5 5.5 0 0 0 9 3.5Zm-4.5 5.5a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z" fill="currentColor"/>
        </svg>
        <input id="search" type="search" placeholder="Search skills, projects…" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd" title="Press / to search">/</kbd>
        <button class="clear-btn" id="clear-btn" type="button" aria-label="Clear search">×</button>
      </div>
    </div>
  </header>

  <main id="view" class="view">
    <div class="loading">loading…</div>
  </main>

  <footer class="footer">
    <span class="footer-note">prototype — dummy data</span>
    <span class="footer-sep">·</span>
    <span>real wiring (<code>sources.yml</code>, <code>SKILL.md</code> scan, <code>.link-roots</code> + <code>skills.lock</code>) lands after your feedback</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
